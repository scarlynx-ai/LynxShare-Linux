<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161e38" />
      <stop offset="100%" stop-color="#0b0f1e" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#00e5ff" stroke-width="4" stroke-opacity="0.4" />

  <!-- Folder Tab Backing -->
  <path d="M 130 180 L 230 180 L 260 215 L 130 215 Z" fill="#00e5ff" opacity="0.9" />

  <!-- Main Folder Body -->
  <rect x="130" y="210" width="252" height="155" rx="20" fill="#f8fafc" filter="url(#glow)" />

  <!-- Top Arrow (Send / Green-Teal) -->
  <path d="M 195 257 L 275 257 C 277 257 278 258 278 260 L 278 250 L 310 265 L 278 280 L 278 270 C 278 272 277 273 275 273 L 195 273 C 193 273 191 271 191 269 L 191 261 C 191 259 193 257 195 257 Z" fill="#00b488" />

  <!-- Bottom Arrow (Receive / Cyan) -->
  <path d="M 315 313 L 235 313 C 233 313 232 312 232 310 L 232 320 L 200 305 L 232 290 L 232 300 C 232 298 233 297 235 297 L 315 297 C 317 297 319 299 319 301 L 319 309 C 319 311 317 313 315 313 Z" fill="#00c8ff" />

  <!-- Lunar Lake Indicator Orb -->
  <circle cx="360" cy="165" r="16" fill="url(#cyanGrad)" />
  <circle cx="360" cy="165" r="8" fill="#ffffff" />
</svg>
